name: macOS validation
on:
  push:
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - run: swift test
      - run: swift run minimodell-diagnostics --config Config/local.example.json
      - run: swift run minimodell-diagnostics --config Config/enterprise.example.json
      - run: scripts/package-app.sh
      - run: bash -n scripts/mdm-readiness.sh
      - run: scripts/mdm-readiness.sh build/minimodeLL.app Config/enterprise.example.json
      - run: scripts/make-profile.py Config/enterprise.example.json build/minimodell.mobileconfig
      - run: plutil -lint build/minimodell.mobileconfig
